name: Dependabot auto-merge

# Auto-merges Dependabot minor/patch version bumps once all other checks pass.
# Major bumps are left for manual review.
#
# A PR is only merged when its branch already contains the current base tip.
# Without that rule, two PRs branched from the same commit each pass CI against
# their own lockfile, and merging both makes git text-merge the second one's
# lockfile diff onto an already-moved base -- producing duplicate YAML keys and
# an install that fails on the base branch and on every open PR.
#
# When the branch is behind, this job updates it and then KEEPS GOING in the
# same run. It must not update the branch and exit expecting to be re-invoked:
# the update is pushed with GITHUB_TOKEN, and GitHub deliberately does not start
# new workflow runs from GITHUB_TOKEN pushes. An earlier version assumed the
# opposite and left every PR that fell behind stranded with no auto-merge check
# at all, waiting for an event that never arrives.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Re-evaluate when CI finishes instead of holding a paid runner
  # asleep waiting for it. Scoped to the workflow NAME so this file
  # can never trigger itself.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Vercel is usually the slowest check and is not a workflow, so
  # workflow_run cannot see it finish. Its check suite can. The job gate
  # below restricts this to the vercel app: suites from other apps are
  # skipped before a runner is allocated, which costs nothing, and a
  # vercel suite can never be produced by this workflow itself.
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # Without these the job cannot read its own PR's checks: `gh pr checks`
  # exits 1 with unparseable output, every attempt reports "checks
  # unreadable", and the run sleeps out its whole window and merges
  # nothing. That failure is silent -- the job still reports success.
  checks: read
  statuses: read

# Scoped to a single PR, not the whole repo. A repo-wide group looks like safe
# serialization, but GitHub cancels an already-pending run when a newer one
# queues into the same group, so a batch of Dependabot PRs loses the middle
# ones. Cross-PR safety comes from the base-tip checks below.
concurrency:
  group: dependabot-auto-merge-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: auto-merge
    if: >-
      ${{ (github.event_name == 'pull_request_target'
            && github.event.pull_request.user.login == 'dependabot[bot]')
          || (github.event_name == 'workflow_run'
            && github.event.workflow_run.event == 'pull_request'
            && github.event.workflow_run.pull_requests[0] != null)
          || (github.event_name == 'check_suite'
            && github.event.check_suite.app.slug == 'vercel'
            && github.event.check_suite.pull_requests[0] != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Only runs on the PR event: this action reads github.event.pull_request
      # and fails outright on workflow_run. The minor/patch verdict it
      # produces is carried to the workflow_run path by the label below.
      - name: Fetch Dependabot metadata
        id: meta
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge when up to date and green (minor/patch only)
        # On the PR event the verdict comes from fetch-metadata. On every
        # other event that action has not run, so eligibility is enforced
        # inside the script by the label gate instead.
        if: >-
          ${{ github.event_name != 'pull_request_target'
              || contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'),
                          steps.meta.outputs.update-type) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number
                  || github.event.workflow_run.pull_requests[0].number
                  || github.event.check_suite.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
          ELIGIBLE_LABEL: automerge:minor-patch
        run: |
          set -uo pipefail

          # The minor/patch decision comes from fetch-metadata, which only
          # runs on the PR event. Persist it as a label so the workflow_run
          # path can trust it without re-deriving it -- group PRs have no
          # parseable from/to versions in their title, so re-deriving is not
          # reliable.
          if [ "$EVENT" = "pull_request_target" ]; then
            gh label create "$ELIGIBLE_LABEL" --repo "$REPO" --color ededed \
              --description "Dependabot minor/patch bump cleared for auto-merge" >/dev/null 2>&1 || true
            gh pr edit "$PR" --repo "$REPO" --add-label "$ELIGIBLE_LABEL" >/dev/null 2>&1 || true
          else
            AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author --jq .author.login 2>/dev/null || echo "")
            if [ "$AUTHOR" != "app/dependabot" ] && [ "$AUTHOR" != "dependabot[bot]" ]; then
              echo "PR #$PR is not a Dependabot PR (author=$AUTHOR) - nothing to do."
              exit 0
            fi
            if ! gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null \
                 | grep -qx "$ELIGIBLE_LABEL"; then
              echo "PR #$PR has no $ELIGIBLE_LABEL label - not cleared for auto-merge."
              exit 0
            fi
          fi

          # Reports this repo's own CI workflow for a sha as one of:
          #   success | pending | none | action_required | <other conclusion>
          # Only "success" may merge. An empty workflow_runs array yields the
          # literal "null|null", which is reported as "none", never as a pass.
          ci_state() {
            local sha="$1" wf run st cc
            # Resolve by workflow NAME, not filename: this repo's CI job may live in
            # ci.yml or verify.yml. If there is no CI workflow at all, this gate has
            # nothing to prove and must stay silent -- returning "none" here would
            # block every merge in a repo that simply has no CI.
            wf=$(gh api "repos/$REPO/actions/workflows" \
                   --jq '[.workflows[] | select(.name=="CI" and .state=="active")][0].id' 2>/dev/null) || wf=""
            case "$wf" in ""|null) echo "absent-workflow"; return ;; esac
            run=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$sha&per_page=1" \
                    --jq '.workflow_runs[0] | "\(.status)|\(.conclusion)"' 2>/dev/null) || run=""
            case "$run" in
              ""|"null|null") echo "none"; return ;;
            esac
            st="${run%%|*}"; cc="${run##*|}"
            if [ "$st" != "completed" ]; then echo "pending"; return; fi
            case "$cc" in
              success)  echo "success" ;;
              null|"")  echo "pending" ;;
              *)        echo "$cc" ;;
            esac
          }

          # Up to three passes. Each pass re-reads the head, because updating the
          # branch rewrites it and nothing else will tell us it moved.
          for attempt in 1 2 3; do
            HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
            STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            if [ "$STATE" != "OPEN" ]; then
              echo "PR is $STATE - nothing to do."
              exit 0
            fi

            # --- Is the branch behind the base? ---
            BEHIND=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq '.behind_by' 2>/dev/null || echo "")
            if [ -z "$BEHIND" ]; then
              echo "::warning::Could not determine how far behind $BASE this PR is - not merging."
              exit 0
            fi
            if [ "$BEHIND" -gt 0 ]; then
              echo "::notice::Attempt $attempt: $BEHIND commit(s) behind $BASE - updating the branch."
              if ! gh pr update-branch "$PR" --repo "$REPO"; then
                echo "::warning::update-branch failed (likely a conflict). Leaving for Dependabot to rebase."
                exit 0
              fi
              # The push above uses GITHUB_TOKEN and will NOT start another run,
              # so carry on here rather than waiting to be called again.
              sleep 20
              continue
            fi

            # --- Wait for this head's other checks to settle ---
            #
            # `gh pr checks` only reports checks that actually EXIST. A CI run
            # that produced no check runs -- one parked at `action_required`
            # awaiting workflow approval, or one never started -- is simply
            # ABSENT from that list, and an absent check counts here as neither
            # failed nor pending, i.e. it reads as green.
            #
            # That is exactly how a red CI reached main: the two Vercel checks
            # passed, the CI job was missing rather than failing, the loop
            # called it settled, and a lockfile that cannot install was merged.
            # So ci.yml is verified separately against the Actions API, for the
            # exact head sha, and absence is never treated as success.
            settled=0
            # Poll briefly, then let go. The runner is billed for wall-clock
            # time, so every second spent asleep here costs the same as a
            # second spent working: a 20x30s loop billed ~11 minutes per run
            # and consumed ~1,900 Actions minutes in a single cycle. A PR
            # whose checks are still running is picked up by the next event
            # instead. Do NOT raise these numbers to 'make merging more
            # reliable' -- that trade is what caused the overrun.
            for i in $(seq 1 3); do
              sleep 20
              # `gh pr checks` exits 8 while checks are still pending, and this step
              # runs under `bash -e`, where the assignment IS the command -- so an
              # unguarded assignment kills the job before rc is ever read, precisely
              # when checks are still running. Capture the status through `||`.
              rc=0
              json=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket,description 2>/dev/null) || rc=$?
              # gh exits non-zero both when a check FAILED (output still valid)
              # and when it could not read anything at all. Distinguish on the
              # payload, not the code: unparseable means unknown, not green.
              if ! echo "$json" | jq -e 'type == "array"' >/dev/null 2>&1; then
                echo "::notice::Attempt $i: PR checks unreadable (gh exit $rc) - not assuming green."
                continue
              fi
              # Ignore this workflow's own check so we don't wait on ourselves.
              ext=$(echo "$json" | jq '[.[] | select((.name | ascii_downcase) | test("auto-merge") | not)]')
              # Snyk reports an exhausted test allowance as a failed check. That is a
              # billing state, not a finding about this change, so it must not hold a
              # merge. A Snyk failure with any other message still blocks.
              blocking=$(echo "$ext" | jq '[.[]
                | select(.bucket == "fail")
                | select((((.name // "") | ascii_downcase | test("snyk"))
                          and (((.description // "") | ascii_downcase)
                               | test("limit of private tests|used your limit"))) | not)]')
              failed=$(echo "$blocking" | jq 'length')
              pending=$(echo "$ext" | jq '[.[] | select(.bucket == "pending")] | length')
              waived=$(echo "$ext" | jq -r '[.[] | select(.bucket == "fail") | .name] - [.[] | select(.bucket == "fail") | .name] | length' 2>/dev/null || echo 0)
              if [ "$failed" -gt 0 ]; then
                echo "A required check failed - not merging:"
                echo "$blocking" | jq -r '.[] | "  \(.name): \(.description // "no detail")"'
                exit 0
              fi
              # An absent or unfinished CI run is not a pass. See the note above.
              SHA_NOW=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid 2>/dev/null || echo "$HEAD_SHA")
              ci=$(ci_state "$SHA_NOW")
              case "$ci" in
                success|absent-workflow) ;;
                none|pending)
                  echo "::notice::Attempt $i: ci.yml on $SHA_NOW is '$ci' - waiting."
                  continue ;;
                action_required)
                  echo "::error::ci.yml on $SHA_NOW needs workflow approval and never ran - not merging."
                  gh pr comment "$PR" --repo "$REPO" --body \
                    "⚠️ Auto-merge refused: the CI run for \`$SHA_NOW\` is parked at \`action_required\`, so it produced no check runs and nothing here proves this branch is green. Approve the workflow run (Actions tab) or push a commit, and CI will run." >/dev/null 2>&1 || true
                  exit 0 ;;
                *)
                  echo "::error::ci.yml on $SHA_NOW concluded '$ci' - not merging."
                  exit 0 ;;
              esac

              if [ "$pending" -eq 0 ]; then settled=1; break; fi
            done
            if [ "$settled" != "1" ]; then
              echo "Checks did not settle in time - leaving for manual review."
              exit 0
            fi

            # --- The base can move while checks run; re-check before merging ---
            NOW_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
            BEHIND=$(gh api "repos/$REPO/compare/$BASE...$NOW_SHA" --jq '.behind_by' 2>/dev/null || echo "")
            if [ -n "$BEHIND" ] && [ "$BEHIND" -gt 0 ]; then
              echo "::notice::$BASE advanced while checks ran - going round again."
              continue
            fi

            # --- Never let a corrupt pnpm lockfile reach the base branch ---
            # Read-only content fetch; no PR code is executed. A key repeated
            # inside packages: or snapshots: is the corruption signature (once in
            # each section is normal).
            LOCK_OK=1
            if gh api "repos/$REPO/contents/pnpm-lock.yaml?ref=$NOW_SHA" \
                 -H "Accept: application/vnd.github.raw" > /tmp/lock.yaml 2>/dev/null; then
              python3 - /tmp/lock.yaml <<'PY' || LOCK_OK=0
          import re, sys
          section, seen, dupes = None, {}, []
          for i, line in enumerate(open(sys.argv[1]), 1):
              line = line.rstrip("\n")
              if re.match(r'^(packages|snapshots|importers):\s*$', line):
                  section = line.split(':')[0]
                  seen[section] = {}
                  continue
              m = re.match(r"^  ('[^']+'|[^ :][^:]*):", line)
              if m and section in ('packages', 'snapshots'):
                  k = m.group(1).strip("'")
                  if k in seen[section]:
                      dupes.append("%s: %s (line %d, first at %d)" % (section, k, i, seen[section][k]))
                  else:
                      seen[section][k] = i
          if dupes:
              print("Duplicate keys in pnpm-lock.yaml:")
              for d in dupes[:10]:
                  print("  " + d)
              sys.exit(1)
          PY
            fi
            if [ "$LOCK_OK" != "1" ]; then
              echo "::error::pnpm-lock.yaml on this branch has duplicate keys - refusing to merge."
              gh pr comment "$PR" --repo "$REPO" --body \
                "⚠️ Auto-merge refused: \`pnpm-lock.yaml\` on this branch has duplicate mapping keys, which makes \`pnpm install\` fail with \`ERR_PNPM_BROKEN_LOCKFILE\`. This usually means a base-branch update text-merged two lockfile changes. Ask Dependabot to regenerate it with \`@dependabot recreate\`."
              exit 0
            fi

            # The head can move while the guards above run. Re-verify CI
            # against the exact sha that is about to be squashed onto the base.
            ci=$(ci_state "$NOW_SHA")
            if [ "$ci" != "success" ] && [ "$ci" != "absent-workflow" ]; then
              echo "::error::CI on $NOW_SHA is '$ci', not success - not merging."
              exit 0
            fi

            # --- The lockfile must still honour the manifest's overrides ---
            # Dependabot regenerates lockfiles without applying pnpm.overrides,
            # which drops the lockfile's own overrides: block and reverts the
            # pinned versions. pnpm install --frozen-lockfile then refuses the
            # result with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH, so wherever CI runs
            # a frozen install this is a broken build, not a silent regression.
            # This gate is the backstop for the repos that have no CI, and for
            # Vercel, whose own install is not frozen.
            OV=1
            if gh api "repos/$REPO/contents/package.json?ref=$NOW_SHA" \
                 -H "Accept: application/vnd.github.raw" > /tmp/ovman.json 2>/dev/null \
               && gh api "repos/$REPO/contents/pnpm-lock.yaml?ref=$NOW_SHA" \
                 -H "Accept: application/vnd.github.raw" > /tmp/ovlock.yaml 2>/dev/null; then
              python3 - /tmp/ovman.json /tmp/ovlock.yaml <<'PY' > /tmp/ovout.txt 2>&1 || OV=0
          import json, re, sys
          declared = json.load(open(sys.argv[1])).get("pnpm", {}).get("overrides") or {}
          if not declared:
              print("no pnpm overrides declared")
              sys.exit(0)
          text = open(sys.argv[2]).read()
          m = re.search(r'^overrides:\n((?:[ \t]+\S.*\n|\n)*)', text, re.M)
          recorded = {}
          if m:
              for line in m.group(1).split("\n"):
                  km = re.match(r"^\s+('[^']+'|[^:]+):\s*(.*)$", line)
                  if km:
                      recorded[km.group(1).strip().strip("'")] = km.group(2).strip().strip("'")
          bad = []
          for k, v in declared.items():
              if k not in recorded:
                  bad.append("missing from lockfile: %s = %s" % (k, v))
              elif recorded[k] != v:
                  bad.append("value differs: %s = %s in package.json, %s in lockfile" % (k, v, recorded[k]))
          if bad:
              print("the lockfile no longer honours the declared overrides:")
              for b in bad[:10]:
                  print("  " + b)
              sys.exit(1)
          print("%d override(s) honoured by the lockfile" % len(declared))
          PY
            fi
            if [ "$OV" != "1" ]; then
              echo "::error::The lockfile no longer honours package.json overrides - refusing to merge."
              cat /tmp/ovout.txt 2>/dev/null || true
              gh pr comment "$PR" --repo "$REPO" --body \
                "⚠️ Auto-merge refused: this branch's \`pnpm-lock.yaml\` no longer honours the \`pnpm.overrides\` declared in \`package.json\`. Dependabot regenerates lockfiles without applying them, so the pinned versions revert and \`pnpm install --frozen-lockfile\` fails with \`ERR_PNPM_LOCKFILE_CONFIG_MISMATCH\`. Fix by running \`pnpm install --lockfile-only\` on the branch and pushing the result." >/dev/null 2>&1 || true
              exit 0
            fi

            gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
            exit 0
          done

          echo "::warning::Branch kept falling behind across 3 attempts - leaving for the next Dependabot rebase."
