version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    # One grouped PR a month for minor and patch bumps, merged automatically
    # once Vercel builds it green (.github/workflows/dependabot-merge.yml).
    schedule:
      interval: "monthly"
    # Skip releases younger than a week: most malicious npm publishes are caught
    # and pulled within days. Applies to version updates only.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Never merged automatically: a monthly list of the majors available,
      # for review by hand.
      majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      # Security fixes arrive as soon as an advisory lands, whatever the
      # schedule and cooldown say, and merge automatically once green.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native (Go) rewrite: it drops the `main` entry
      # point (lib/typescript.js) and `tsserver`, so Next.js's
      # `require.resolve("typescript")` detection fails and the build dies with
      # "Please install typescript". Hold at v6 until Next.js supports the v7
      # package layout.
      - dependency-name: "typescript"
        versions: [">=7"]
